<!DOCTYPE html>
<html>
<head>
<title>Tạo form và các điều khiển</title>
<meta charset="UTF-8">
<style>
    body { font-family: Arial, sans-serif; }
    table {
        border: 1px solid #669966;
        border-collapse: collapse;
        width: 600px;
        background-color: #E6F5E6;
    }
    td { padding: 6px; border: 1px solid #669966; }
    h2.title {
        text-align: center;
        color: #669933;
        font-family: "Times New Roman", serif;
    }
    input[type=text] { width: 250px; }
    select[multiple] { width: 200px; }
    input[type=button] {
        background-color: #CCE6CC;
        border: 1px solid #669966;
    }
    #lblThongBao {
        text-align: center;
        color: #FF0000;
        font-weight: bold;
    }
</style>
</head>
<body>

<form id="frmDangKy">
<table align="center" cellpadding="5" cellspacing="0">
    <tr>
        <td colspan="2"><h2 class="title">Phiếu đăng ký tham gia chương trình khuyến mãi</h2></td>
    </tr>
    <tr>
        <td>Họ và tên</td>
        <td><input type="text" id="txtHoTen"></td>
    </tr>
    <tr>
        <td>Địa chỉ</td>
        <td><input type="text" id="txtDiaChi"></td>
    </tr>
    <tr>
        <td>Điện thoại</td>
        <td><input type="text" id="txtDienThoai"></td>
    </tr>
    <tr>
        <td>Phái</td>
        <td>
            <input type="radio" name="rdPhai" id="rdNam" value="Nam"> Nam
            <input type="radio" name="rdPhai" id="rdNu" value="Nữ" checked> Nữ
        </td>
    </tr>
    <tr>
        <td>Nghề nghiệp</td>
        <td>
            <select id="ddNgheNghiep">
                <option value="Bác sĩ">Bác sĩ</option>
                <option value="Kỹ sư">Kỹ sư</option>
                <option value="Giáo viên" selected>Giáo viên</option>
                <option value="Khác">Khác</option>
            </select>
        </td>
    </tr>
    <tr>
        <td>Chọn sản phẩm tham gia</td>
        <td>
            <select id="lstSanPham" size="4" multiple>
                <option value="Kem đánh răng">Kem đánh răng</option>
                <option value="Bột giặt">Bột giặt</option>
                <option value="Dầu gội đầu" selected>Dầu gội đầu</option>
                <option value="Sữa tắm">Sữa tắm</option>
            </select>
        </td>
    </tr>
    <tr>
        <td>Số người dự đoán tham gia</td>
        <td><input type="text" id="txtSoNguoi"></td>
    </tr>
    <tr>
        <td colspan="2" align="center">
            <input type="button" id="btnDongY" value="Đồng ý" onclick="XuLyDangKy()">
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <div id="lblThongBao"></div>
        </td>
    </tr>
</table>
</form>

<script>
function XuLyDangKy() {
    document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
}
</script>

</body>
</html>
